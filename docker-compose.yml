services:
  sdr-fm:
    build: .
    image: sdr-fm-receiver:latest
    ports:
      - "8080:8080"
    environment:
      # Default rtl_tcp host reachable from this container. Override as needed.
      - RTL_TCP_HOST=192.168.0.6
      - RTL_TCP_PORT=1234
      - RTL_TCP_FREQ=95.1e6
      - RTL_TCP_AM_FREQ=14.0235e6
      # Fixed tuner gain (dB). Auto gain overloads the ADC on strong signals.
      - RTL_TCP_GAIN=40
      # Default receiver mode (fm|dab) and DAB ensemble frequency (Hz).
      - RTL_TCP_MODE=fm
      - RTL_TCP_DAB_FREQ=216.928e6
      - RTL_TCP_MESHTASTIC_FREQ=869.525e6
      - RTL_TCP_ADSB_FREQ=1090e6
      # Optional fixed radar centre for the ADS-B map (decimal degrees).
      - HOME_LAT=53.410158
      - HOME_LON=-2.5738129
      # Saved stations live in this file (survives container rebuilds via volume).
      - PRESETS_FILE=/data/presets.json
      - USERS_FILE=/data/users.json
      - USER_SETTINGS_FILE=/data/user-settings.json
    volumes:
      # Data stored on the NAS (kept through rebuilds; renamed save file stays at /data).
      - /mnt/nas/docker-volumes/fm-dab-radio-receiver_sdr-presets:/data
    restart: unless-stopped
