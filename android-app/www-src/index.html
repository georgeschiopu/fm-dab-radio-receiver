<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SDR Receiver</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101418;
        color: #e6edf3;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
      }
      .card {
        width: min(380px, 92vw);
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        color: #58a6ff;
        text-align: center;
      }
      p.sub {
        margin: 0;
        font-size: 13px;
        color: #8b949e;
        text-align: center;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
        color: #8b949e;
      }
      input {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #e6edf3;
        padding: 12px 10px;
        font-size: 15px;
        width: 100%;
      }
      input:focus {
        outline: none;
        border-color: #58a6ff;
      }
      button {
        background: #238636;
        border: 1px solid #2ea043;
        border-radius: 6px;
        color: #fff;
        padding: 12px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      button:active {
        background: #2ea043;
      }
      button.ghost {
        background: #21262d;
        border-color: #30363d;
        color: #e6edf3;
      }
      .connect-msg {
        font-size: 14px;
        color: #e6edf3;
        text-align: center;
        word-break: break-all;
      }
      .view {
        display: none;
        flex-direction: column;
        gap: 16px;
      }
      .view.show {
        display: flex;
      }
      .hint {
        font-size: 12px;
        color: #6e7681;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SDR Receiver</h1>

      <div id="connect-view" class="view">
        <p class="connect-msg">
          Connecting to <span id="target-url"></span>…
        </p>
        <button id="change-btn" class="ghost">Change server</button>
      </div>

      <form id="form-view" class="view" autocomplete="off">
        <p class="sub">Enter the address of your SDR web server.</p>
        <label>
          Server address
          <input
            id="server-input"
            type="text"
            inputmode="url"
            placeholder="192.168.0.6:8080"
          />
        </label>
        <button type="submit" id="connect-btn">Save &amp; connect</button>
        <div class="hint">
          The phone must be on the same network as the server. rtl_tcp is
          reached through the server, no SDR access is needed on the phone.
        </div>
      </form>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
